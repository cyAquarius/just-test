name: 发布到 Maven Central

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-maven-central
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: 验证双产品线
    uses: ./.github/workflows/test.yml

  publish:
    name: 签名并发布到 Maven Central
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    needs: [verify]
    runs-on: ubuntu-latest
    # publish-central-modules.sh 对每个模块最多等待 60 分钟。两个慢的
    # PUBLISHING 加上本 job 的构建会超过原先的 45 分钟，第二个制品来不及上传。
    timeout-minutes: 180
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Java 8/17、Maven、GPG 与 Central 凭据
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            17
          cache: maven
          cache-dependency-path: |
            pom.xml
            just-test-core/pom.xml
            just-test-boot2/pom.xml
            just-test-boot3/pom.xml
            smoke-tests/boot2/pom.xml
            smoke-tests/boot3/pom.xml
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: 校验发布版本
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(mvn --quiet --non-recursive help:evaluate -Dexpression=project.version -DforceStdout)"
          if [[ ! "${project_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "POM version must be X.Y.Z: ${project_version}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == tag && "${GITHUB_REF_NAME#v}" != "${project_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} must match POM version ${project_version}" >&2
            exit 1
          fi

      - name: 配置 GnuPG 非交互签名
        shell: bash
        run: |
          set -euo pipefail
          homedir="${GNUPGHOME:-${HOME}/.gnupg}"
          mkdir -p "${homedir}"
          chmod 700 "${homedir}"
          printf 'pinentry-mode loopback\n' >> "${homedir}/gpg.conf"
          printf 'allow-loopback-pinentry\n' >> "${homedir}/gpg-agent.conf"
          gpgconf --kill gpg-agent 2>/dev/null || true

      - name: 使用对应 JDK 构建、测试并安装发布依赖
        run: mvn --batch-mode --no-transfer-progress -Pdual-jdk-release,central-publish -pl just-test-core -am clean install

      - name: 签名、验证暂存产物并发布
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CENTRAL_USERNAME:-}" ] || [ -z "${CENTRAL_PASSWORD:-}" ]; then
            echo "缺少 GitHub Secrets: CENTRAL_USERNAME / CENTRAL_PASSWORD" >&2
            exit 1
          fi
          bash scripts/publish-central-modules.sh
