name: 发布 Maven 包

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-maven-package
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: 验证双产品线
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  detect-publish:
    name: 判断是否需要发布
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 识别非文档变更
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "should_publish=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "${before}" ] || [[ "${before}" =~ ^0+$ ]]; then
            echo "should_publish=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${before}" || true
          fi
          if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "should_publish=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          should_publish=false
          while IFS= read -r path; do
            [ -z "${path}" ] && continue
            case "${path}" in
              *.md|LICENSE)
                ;;
              *)
                should_publish=true
                break
                ;;
            esac
          done < <(git diff --name-only "${before}" "${GITHUB_SHA}")
          echo "should_publish=${should_publish}" >> "${GITHUB_OUTPUT}"
          echo "should_publish=${should_publish}"

  publish:
    name: 构建、烟测并发布双产品线
    needs: [verify, detect-publish]
    if: needs.detect-publish.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Java 8/17 Toolchains、Maven 与 GitHub Packages
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            17
          cache: maven
          cache-dependency-path: |
            pom.xml
            just-test-core/pom.xml
            just-test-boot2/pom.xml
            just-test-boot3/pom.xml
            smoke-tests/boot2/pom.xml
            smoke-tests/boot3/pom.xml
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: 使用对应 JDK 构建并测试待发布产物
        run: mvn --batch-mode --no-transfer-progress -Pdual-jdk-release clean install

      - name: 读取待发布版本
        id: project
        shell: bash
        run: |
          project_version="$(mvn --quiet --non-recursive help:evaluate -Dexpression=project.version -DforceStdout)"
          printf 'version=%s\n' "${project_version}" >> "${GITHUB_OUTPUT}"

      - name: 验证 Java 8 / Boot 2 待发布产物消费
        run: |
          JAVA_HOME="${JAVA_HOME_8_X64}" \
          PATH="${JAVA_HOME_8_X64}/bin:${PATH}" \
          mvn --batch-mode --no-transfer-progress -f smoke-tests/boot2/pom.xml -Djust-test.version="${PROJECT_VERSION}" clean test
        env:
          PROJECT_VERSION: ${{ steps.project.outputs.version }}

      - name: 验证 Java 17 / Boot 3 待发布产物消费
        run: mvn --batch-mode --no-transfer-progress -f smoke-tests/boot3/pom.xml -Djust-test.version="${PROJECT_VERSION}" clean test
        env:
          PROJECT_VERSION: ${{ steps.project.outputs.version }}

      - name: 发布已经构建和烟测的 POM 与 JAR
        run: |
          mvn --batch-mode --no-transfer-progress org.apache.maven.plugins:maven-deploy-plugin:deploy-file -Dfile=pom.xml -DpomFile=pom.xml -DrepositoryId=github -Durl=https://maven.pkg.github.com/cyaquarius/just-test
          mvn --batch-mode --no-transfer-progress org.apache.maven.plugins:maven-deploy-plugin:deploy-file -Dfile="just-test-core/target/just-test-core-${PROJECT_VERSION}.jar" -DpomFile=just-test-core/pom.xml -DrepositoryId=github -Durl=https://maven.pkg.github.com/cyaquarius/just-test
          mvn --batch-mode --no-transfer-progress org.apache.maven.plugins:maven-deploy-plugin:deploy-file -Dfile="just-test-boot2/target/just-test-boot2-${PROJECT_VERSION}.jar" -DpomFile=just-test-boot2/pom.xml -DrepositoryId=github -Durl=https://maven.pkg.github.com/cyaquarius/just-test
          mvn --batch-mode --no-transfer-progress org.apache.maven.plugins:maven-deploy-plugin:deploy-file -Dfile="just-test-boot3/target/just-test-boot3-${PROJECT_VERSION}.jar" -DpomFile=just-test-boot3/pom.xml -DrepositoryId=github -Durl=https://maven.pkg.github.com/cyaquarius/just-test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_VERSION: ${{ steps.project.outputs.version }}
