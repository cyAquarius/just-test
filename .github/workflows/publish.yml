name: 发布到 Maven Central

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-maven-central
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: 验证双产品线
    uses: ./.github/workflows/test.yml

  publish:
    name: 签名并发布到 Maven Central
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Java 8/17、Maven、GPG 与 Central 凭据
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            17
          cache: maven
          cache-dependency-path: |
            pom.xml
            just-test-core/pom.xml
            just-test-boot2/pom.xml
            just-test-boot3/pom.xml
            smoke-tests/boot2/pom.xml
            smoke-tests/boot3/pom.xml
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: 配置 GnuPG 非交互签名
        shell: bash
        run: |
          set -euo pipefail
          homedir="${GNUPGHOME:-${HOME}/.gnupg}"
          mkdir -p "${homedir}"
          chmod 700 "${homedir}"
          printf 'pinentry-mode loopback\n' >> "${homedir}/gpg.conf"
          printf 'allow-loopback-pinentry\n' >> "${homedir}/gpg-agent.conf"
          gpgconf --kill gpg-agent 2>/dev/null || true

      - name: 使用对应 JDK 构建并测试
        run: mvn --batch-mode --no-transfer-progress -Pdual-jdk-release clean install

      - name: 读取版本
        id: project
        shell: bash
        run: |
          project_version="$(mvn --quiet --non-recursive help:evaluate -Dexpression=project.version -DforceStdout)"
          printf 'version=%s\n' "${project_version}" >> "${GITHUB_OUTPUT}"

      - name: 验证 Java 8 / Boot 2 安装产物消费
        run: |
          JAVA_HOME="${JAVA_HOME_8_X64}" \
          PATH="${JAVA_HOME_8_X64}/bin:${PATH}" \
          mvn --batch-mode --no-transfer-progress -f smoke-tests/boot2/pom.xml -Djust-test.version="${PROJECT_VERSION}" clean test
        env:
          PROJECT_VERSION: ${{ steps.project.outputs.version }}

      - name: 验证 Java 17 / Boot 3 安装产物消费
        run: mvn --batch-mode --no-transfer-progress -f smoke-tests/boot3/pom.xml -Djust-test.version="${PROJECT_VERSION}" clean test
        env:
          PROJECT_VERSION: ${{ steps.project.outputs.version }}

      - name: 按 tag 去掉 SNAPSHOT 并发布
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CENTRAL_USERNAME:-}" ] || [ -z "${CENTRAL_PASSWORD:-}" ]; then
            echo "缺少 GitHub Secrets: CENTRAL_USERNAME / CENTRAL_PASSWORD" >&2
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            release_version="${GITHUB_REF_NAME#v}"
            mvn --batch-mode --no-transfer-progress versions:set -DnewVersion="${release_version}" -DgenerateBackupPoms=false
          else
            release_version="$(mvn --quiet --non-recursive help:evaluate -Dexpression=project.version -DforceStdout)"
            if [[ "${release_version}" == *-SNAPSHOT ]]; then
              echo "Maven Central 不接收 SNAPSHOT。请打 tag，例如 v1.0.0。" >&2
              exit 1
            fi
          fi
          mvn --batch-mode --no-transfer-progress -Pdual-jdk-release,central-publish \
            -DskipTests -Dgpg.passphraseEnvName=MAVEN_GPG_PASSPHRASE deploy
