<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelican Bicycle Parade</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #fff4d8;
    }

    svg {
      display: block;
      width: min(100vw, 1280px);
      height: auto;
      max-height: 100vh;
      filter: drop-shadow(0 16px 24px rgb(42 73 83 / 18%));
    }

    .cloud-one {
      animation: cloud-drift 16s linear infinite;
    }

    .cloud-two {
      animation: cloud-drift 22s linear -8s infinite;
    }

    .road-marks {
      animation: road-slide 1.1s linear infinite;
    }

    .speed-line {
      animation: speed-pulse 1.1s ease-in-out infinite;
    }

    .speed-line:nth-child(2) {
      animation-delay: -.35s;
    }

    .speed-line:nth-child(3) {
      animation-delay: -.7s;
    }

    #rear-wheel-spin {
      transform-origin: 202px 283px;
      animation: wheel-turn .85s linear infinite;
    }

    #front-wheel-spin {
      transform-origin: 457px 283px;
      animation: wheel-turn .85s linear infinite;
    }

    #pedals {
      transform-origin: 330px 280px;
      animation: wheel-turn .85s linear infinite;
    }

    #pelican {
      transform-origin: 302px 205px;
      animation: rider-bob .85s ease-in-out infinite;
    }

    #wing {
      transform-origin: 292px 147px;
      animation: wing-flap .85s ease-in-out infinite;
    }

    #cap-ribbon {
      transform-origin: 359px 64px;
      animation: ribbon-wave .55s ease-in-out infinite alternate;
    }

    @keyframes wheel-turn {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes rider-bob {
      0%,
      100% {
        transform: translateY(0) rotate(-.4deg);
      }
      50% {
        transform: translateY(-3px) rotate(.7deg);
      }
    }

    @keyframes wing-flap {
      0%,
      100% {
        transform: rotate(7deg);
      }
      50% {
        transform: rotate(-14deg);
      }
    }

    @keyframes ribbon-wave {
      from {
        transform: rotate(-6deg) scaleX(.94);
      }
      to {
        transform: rotate(9deg) scaleX(1.05);
      }
    }

    @keyframes road-slide {
      to {
        transform: translateX(-128px);
      }
    }

    @keyframes cloud-drift {
      from {
        transform: translateX(90px);
      }
      to {
        transform: translateX(-760px);
      }
    }

    @keyframes speed-pulse {
      0%,
      100% {
        opacity: .18;
        transform: translateX(18px);
      }
      50% {
        opacity: .7;
        transform: translateX(-12px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-play-state: paused !important;
      }
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 640 360" role="img" aria-labelledby="title description">
    <title id="title">A pelican riding a bicycle</title>
    <desc id="description">A cheerful helmeted pelican pedals a turquoise bicycle while its wheels spin, its wing flaps, and the road moves beneath it.</desc>

    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#87dbe5"/>
        <stop offset=".72" stop-color="#dff4dc"/>
        <stop offset="1" stop-color="#fff0bd"/>
      </linearGradient>
      <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#55727a"/>
        <stop offset="1" stop-color="#324c55"/>
      </linearGradient>
      <linearGradient id="wing-feathers" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fffef6"/>
        <stop offset="1" stop-color="#d8e7df"/>
      </linearGradient>
      <linearGradient id="bill" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffc34d"/>
        <stop offset="1" stop-color="#ff8c42"/>
      </linearGradient>
      <pattern id="tire-tread" width="10" height="10" patternUnits="userSpaceOnUse">
        <path d="M-2 8 8-2M2 12 12 2" fill="none" stroke="#f7fbf4" stroke-width="2"/>
      </pattern>
      <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="180%">
        <feGaussianBlur stdDeviation="3"/>
      </filter>
      <clipPath id="scene-clip">
        <rect width="640" height="360" rx="22"/>
      </clipPath>
    </defs>

    <g clip-path="url(#scene-clip)">
      <rect width="640" height="360" fill="url(#sky)"/>
      <circle cx="548" cy="62" r="33" fill="#ffdf68" opacity=".92"/>
      <circle cx="548" cy="62" r="43" fill="none" stroke="#fff2ac" stroke-width="7" opacity=".5"/>

      <g class="cloud-one" fill="#fffdf2" opacity=".75">
        <ellipse cx="650" cy="78" rx="48" ry="13"/>
        <circle cx="625" cy="69" r="17"/>
        <circle cx="653" cy="61" r="24"/>
        <circle cx="680" cy="70" r="16"/>
      </g>
      <g class="cloud-two" fill="#fffdf2" opacity=".6">
        <ellipse cx="830" cy="117" rx="37" ry="10"/>
        <circle cx="812" cy="110" r="13"/>
        <circle cx="834" cy="104" r="18"/>
        <circle cx="854" cy="111" r="12"/>
      </g>

      <path d="M0 214 Q74 143 149 214 T298 214 T447 214 T596 214 T745 214 V270 H0Z" fill="#88c98f" opacity=".65"/>
      <path d="M0 230 Q54 180 109 230 T218 230 T327 230 T436 230 T545 230 T654 230 V270 H0Z" fill="#4fa985" opacity=".78"/>
      <path d="M0 243 Q78 213 156 243 T312 243 T468 243 T624 243 T780 243 V273 H0Z" fill="#277c70"/>

      <g fill="#ffe6aa" opacity=".9">
        <circle cx="61" cy="232" r="3"/>
        <circle cx="82" cy="224" r="2"/>
        <circle cx="558" cy="228" r="3"/>
        <circle cx="581" cy="218" r="2"/>
        <circle cx="603" cy="235" r="2.5"/>
      </g>

      <rect y="259" width="640" height="101" fill="url(#road)"/>
      <path d="M0 259H640" fill="none" stroke="#f9cc62" stroke-width="7"/>
      <path d="M0 267H640" fill="none" stroke="#e69b4f" stroke-width="2" opacity=".85"/>

      <g class="road-marks" fill="#f8e2a4">
        <rect x="-72" y="328" width="76" height="7" rx="3.5"/>
        <rect x="56" y="328" width="76" height="7" rx="3.5"/>
        <rect x="184" y="328" width="76" height="7" rx="3.5"/>
        <rect x="312" y="328" width="76" height="7" rx="3.5"/>
        <rect x="440" y="328" width="76" height="7" rx="3.5"/>
        <rect x="568" y="328" width="76" height="7" rx="3.5"/>
        <rect x="696" y="328" width="76" height="7" rx="3.5"/>
      </g>

      <g fill="none" stroke="#d8ffff" stroke-linecap="round" stroke-width="3">
        <path class="speed-line" d="M80 159h48"/>
        <path class="speed-line" d="M49 178h62"/>
        <path class="speed-line" d="M91 198h31"/>
      </g>

      <ellipse cx="329" cy="329" rx="191" ry="13" fill="#1d3942" opacity=".32" filter="url(#soft-shadow)"/>

      <!-- Rear wheel -->
      <g id="rear-wheel-spin">
        <circle cx="202" cy="283" r="57" fill="#24404b"/>
        <circle cx="202" cy="283" r="49" fill="#f8fff7"/>
        <circle cx="202" cy="283" r="44" fill="#6cc9c5"/>
        <circle cx="202" cy="283" r="39" fill="#f8fff7"/>
        <g stroke="#9cb7b5" stroke-width="2">
          <path d="M202 244v78M163 283h78M174 255l56 56M174 311l56-56"/>
          <path d="M187 247l30 72M166 268l72 30M166 298l72-30M187 319l30-72"/>
        </g>
        <circle cx="202" cy="283" r="7" fill="#ff6b54" stroke="#24404b" stroke-width="3"/>
        <circle cx="202" cy="238" r="3.5" fill="#ff6b54"/>
        <path d="M185 231a55 55 0 0 1 16-3" fill="none" stroke="url(#tire-tread)" stroke-width="5"/>
      </g>

      <!-- Front wheel -->
      <g id="front-wheel-spin">
        <circle cx="457" cy="283" r="57" fill="#24404b"/>
        <circle cx="457" cy="283" r="49" fill="#f8fff7"/>
        <circle cx="457" cy="283" r="44" fill="#6cc9c5"/>
        <circle cx="457" cy="283" r="39" fill="#f8fff7"/>
        <g stroke="#9cb7b5" stroke-width="2">
          <path d="M457 244v78M418 283h78M429 255l56 56M429 311l56-56"/>
          <path d="M442 247l30 72M421 268l72 30M421 298l72-30M442 319l30-72"/>
        </g>
        <circle cx="457" cy="283" r="7" fill="#ff6b54" stroke="#24404b" stroke-width="3"/>
        <circle cx="457" cy="238" r="3.5" fill="#ff6b54"/>
        <path d="M440 231a55 55 0 0 1 16-3" fill="none" stroke="url(#tire-tread)" stroke-width="5"/>
      </g>

      <!-- Bicycle -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M202 283 289 207 330 280H202L289 207 398 278 330 280" stroke="#173b48" stroke-width="15"/>
        <path d="M202 283 289 207 330 280H202L289 207 398 278 330 280" stroke="#16a6a1" stroke-width="9"/>
        <path d="M398 278 430 192 457 283" stroke="#173b48" stroke-width="13"/>
        <path d="M398 278 430 192 457 283" stroke="#ffc44f" stroke-width="7"/>
        <path d="M420 193h37M430 193l-10-25" stroke="#173b48" stroke-width="8"/>
        <path d="M419 168h-17" stroke="#173b48" stroke-width="7"/>
        <path d="M278 202h39" stroke="#173b48" stroke-width="10"/>
        <path d="M272 198h48" stroke="#ff6b54" stroke-width="7"/>
      </g>

      <g id="pedals">
        <circle cx="330" cy="280" r="13" fill="#ffc44f" stroke="#173b48" stroke-width="4"/>
        <path d="M330 280 350 265M330 280l-20 15" fill="none" stroke="#173b48" stroke-width="5" stroke-linecap="round"/>
        <path d="M345 264h17M298 296h17" fill="none" stroke="#ff6b54" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- Pelican rider -->
      <g id="pelican">
        <!-- Tail -->
        <path d="M249 169q-33 4-52 29 32 2 61-12z" fill="#e8f1e8" stroke="#24404b" stroke-width="4" stroke-linejoin="round"/>
        <path d="M246 176q-27 10-39 18" fill="none" stroke="#bccfc8" stroke-width="3" stroke-linecap="round"/>

        <!-- Back leg -->
        <path d="M296 185q4 38 14 70l34 9" fill="none" stroke="#f3a436" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M343 264h20" fill="none" stroke="#24404b" stroke-width="4" stroke-linecap="round"/>

        <!-- Body and neck -->
        <path d="M263 105q25-30 65-14 26 11 30 48 3 34-28 53-36 23-78-1-24-14-19-42 4-25 30-44z" fill="#fffdf2" stroke="#24404b" stroke-width="5" stroke-linejoin="round"/>
        <path d="M321 136q-7-38 10-60 17-22 43-10 22 10 14 41-5 20-3 48z" fill="#fffdf2" stroke="#24404b" stroke-width="5" stroke-linejoin="round"/>

        <!-- Wing -->
        <g id="wing">
          <path d="M294 126q-34-15-53 8-19 24-7 65 39-3 64-31 15-18-4-42z" fill="url(#wing-feathers)" stroke="#24404b" stroke-width="5" stroke-linejoin="round"/>
          <path d="M285 139q-25 2-42 25M289 153q-20 11-39 31M281 169q-13 11-30 22" fill="none" stroke="#b9ccc6" stroke-width="3" stroke-linecap="round"/>
          <path d="M236 194q7 1 17-3M233 182q9 2 20-2" fill="none" stroke="#24404b" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- Front leg -->
        <path d="M321 185q15 34 29 55l-18 31" fill="none" stroke="#ffc34d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M331 272h-20" fill="none" stroke="#24404b" stroke-width="4" stroke-linecap="round"/>

        <!-- Head -->
        <path d="M337 80q6-31 40-28 32 4 29 35-2 24-31 26-36 2-38-33z" fill="#fffdf2" stroke="#24404b" stroke-width="5"/>

        <!-- Bill and pouch -->
        <path d="M386 80q54-8 96 10-41 18-94 6z" fill="url(#bill)" stroke="#24404b" stroke-width="5" stroke-linejoin="round"/>
        <path d="M388 96q38 7 80-2-15 31-53 31-23 0-27-29z" fill="#ffb655" stroke="#24404b" stroke-width="4" stroke-linejoin="round"/>
        <path d="M402 102q27 9 50-2" fill="none" stroke="#ed8743" stroke-width="3" stroke-linecap="round"/>

        <!-- Face -->
        <circle cx="381" cy="76" r="8" fill="#fff" stroke="#24404b" stroke-width="3"/>
        <circle cx="384" cy="77" r="3.5" fill="#24404b"/>
        <path d="M366 63q13-8 23 0" fill="none" stroke="#24404b" stroke-width="3.5" stroke-linecap="round"/>

        <!-- Cap -->
        <path d="M342 60q9-20 34-20 19 1 27 16-31-6-61 4z" fill="#ff6b54" stroke="#24404b" stroke-width="4" stroke-linejoin="round"/>
        <path d="M371 52q-20 2-35 12" fill="none" stroke="#24404b" stroke-width="5" stroke-linecap="round"/>
        <path id="cap-ribbon" d="M352 47q-21-10-36 3 21 0 31 12z" fill="#ffc44f" stroke="#24404b" stroke-width="3" stroke-linejoin="round"/>

        <!-- Happy cheek -->
        <circle cx="367" cy="91" r="5" fill="#ff8b78" opacity=".75"/>
      </g>

      <!-- Handlebar bell -->
      <g>
        <path d="M413 163q0-12 12-12t12 12z" fill="#ffc44f" stroke="#173b48" stroke-width="3"/>
        <circle cx="425" cy="151" r="3" fill="#ff6b54"/>
      </g>

      <g fill="#fff6b3">
        <path d="m511 152 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
        <path d="m531 186 2 5 5 2-5 2-2 5-2-5-5-2 5-2z" opacity=".8"/>
      </g>
    </g>

    <rect x="3" y="3" width="634" height="354" rx="20" fill="none" stroke="#24404b" stroke-width="6"/>
  </svg>
</body>
</html>
